<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>halo — The P3 palette kit</title>
  <meta name="description" content="halo is the P3 palette kit, crafted for screens." />
  <meta name="theme-color" content="#151517" />
  <meta property="og:title" content="halo — The P3 palette kit" />
  <meta property="og:description" content="halo is the P3 palette kit, crafted for screens." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Newsreader:opsz,wght@6..72,300..500&display=swap" />
  <style>
    :root {
      --bg: #151517;
      --bg-2: #1b1b1e;
      --ink: #ededed;
      --muted: #a1a1a1;
      --dim: #6e6e73;
      --line: rgba(255, 255, 255, .12);
      --chip: rgba(255, 255, 255, .04);
      --gutter: clamp(16px, 2.6vw, 28px);
      --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
      --serif: "Newsreader", "Times New Roman", serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
      border-radius: 6px;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      isolation: isolate;
      overflow: hidden;
      background: var(--bg);
    }

    .stage {
      position: absolute;
      inset: 0;
      z-index: -1;
      touch-action: pan-y;
      opacity: 0;
      animation: fade 1.6s .2s ease forwards;
    }

    .stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #fx {
      mix-blend-mode: screen;
    }

    .nav {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px var(--gutter);
      height: 64px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand-slash {
      color: var(--dim);
      font-size: 22px;
      font-weight: 300;
      transform: translateY(-1px);
      user-select: none;
    }

    .brand-name {
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 400;
      letter-spacing: -.01em;
      line-height: 1;
    }

    .links {
      display: flex;
      gap: 20px;
      margin-left: 12px;
    }

    .links a {
      font-size: 14px;
      color: var(--muted);
      transition: color .2s;
      white-space: nowrap;
    }

    .links a:hover {
      color: var(--ink);
    }

    .right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      height: 36px;
      padding: 0 6px 0 12px;
      min-width: 172px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--chip);
      font-size: 14px;
      color: var(--muted);
      transition: border-color .2s, color .2s;
      white-space: nowrap;
    }

    .search:hover {
      border-color: rgba(255, 255, 255, .22);
      color: var(--ink);
    }

    kbd {
      font-family: var(--sans);
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 2px 5px;
      background: rgba(255, 255, 255, .03);
      line-height: 1.2;
    }

    .ask {
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      background: var(--chip);
      transition: background .2s, border-color .2s;
      white-space: nowrap;
    }

    .ask:hover {
      background: rgba(255, 255, 255, .08);
      border-color: rgba(255, 255, 255, .22);
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      transition: background .2s;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, .06);
    }

    .menu {
      display: none;
    }

    .copy {
      position: relative;
      z-index: 1;
      min-height: calc(100svh - 64px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 var(--gutter) 64px;
      max-width: 560px;
      pointer-events: none;
    }

    .copy > * {
      pointer-events: auto;
    }

    .wordmark {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(72px, 8.6vw, 124px);
      line-height: .9;
      letter-spacing: -.035em;
      font-variation-settings: "opsz" 72;
      margin-bottom: clamp(14px, 1.8vw, 22px);
    }

    .lede {
      font-size: clamp(28px, 3.05vw, 44px);
      line-height: 1.2;
      font-weight: 400;
      letter-spacing: -.025em;
      margin-bottom: clamp(24px, 2.6vw, 36px);
    }

    .lede span {
      display: block;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      margin-bottom: 14px;
    }

    .tab {
      color: var(--dim);
      padding: 2px 0;
      transition: color .2s;
      white-space: nowrap;
    }

    .tab:hover {
      color: var(--muted);
    }

    .tab[aria-selected="true"] {
      color: var(--ink);
    }

    .dot {
      color: var(--dim);
      font-size: 11px;
      user-select: none;
    }

    .cmd {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 440px;
      padding-top: 14px;
      font-size: 15px;
      line-height: 1.5;
    }

    .cmd::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, .08) 70%, transparent);
    }

    .cmd-text {
      transition: opacity .18s, transform .18s;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .cmd-text.swap {
      opacity: 0;
      transform: translateY(3px);
    }

    .copy-btn {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border-radius: 7px;
      color: var(--dim);
      transition: color .2s, background .2s;
    }

    .copy-btn:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, .06);
    }

    .copy-btn .ok {
      display: none;
    }

    .copy-btn.done .cp {
      display: none;
    }

    .copy-btn.done .ok {
      display: block;
      color: var(--ink);
    }

    .rise {
      opacity: 0;
      transform: translateY(12px);
      animation: rise .9s cubic-bezier(.2, .7, .2, 1) forwards;
    }

    .copy > .rise:nth-child(2) {
      animation-delay: .08s;
    }

    .copy > .rise:nth-child(3) {
      animation-delay: .16s;
    }

    .copy > .rise:nth-child(4) {
      animation-delay: .24s;
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes fade {
      to {
        opacity: 1;
      }
    }

    @media (max-width: 960px) {
      .search {
        min-width: 0;
        gap: 14px;
      }
    }

    @media (max-width: 820px) {
      .links,
      .search,
      .ask {
        display: none;
      }

      .menu {
        display: grid;
      }

      .copy {
        justify-content: flex-start;
        min-height: 0;
        padding-top: clamp(28px, 7svh, 64px);
        padding-bottom: 0;
        max-width: 100%;
      }

      .hero {
        min-height: max(100svh, 720px);
      }
    }

    @media (max-width: 420px) {
      .tabs {
        font-size: 14px;
        gap: 6px;
      }

      .cmd {
        font-size: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .rise,
      .stage {
        opacity: 1;
        transform: none;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <section class="hero" aria-label="halo">
    <div class="stage" aria-hidden="true"><canvas id="gl"></canvas><canvas id="fx"></canvas></div>
    <header class="nav">
      <div class="brand">
        <a href="#top" class="brand-logo" aria-label="halo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 3 22 20H2z" />
          </svg>
        </a>
        <span class="brand-slash" aria-hidden="true">/</span>
        <a href="#top" class="brand-name">halo</a>
        <nav class="links" aria-label="Primary">
          <a href="#docs">Docs</a>
          <a href="#palettes">Palettes</a>
        </nav>
      </div>
      <div class="right">
        <button type="button" class="search" aria-label="Search">
          <span>Search…</span><kbd>⌘ K</kbd>
        </button>
        <button type="button" class="ask">Ask AI</button>
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="icon-btn" aria-label="GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.11.78-.25.78-.55 0-.27-.01-1.17-.02-2.12-3.2.69-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.58.23 2.75.11 3.04.74.8 1.19 1.83 1.19 3.08 0 4.41-2.69 5.39-5.26 5.67.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.67.79.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z" />
          </svg>
        </a>
        <button type="button" class="icon-btn menu" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M4 8h16M4 16h16" />
          </svg>
        </button>
      </div>
    </header>
    <div class="copy">
      <h1 class="wordmark rise">halo</h1>
      <p class="lede rise"><span>The P3 palette kit,</span><span>crafted for screens.</span></p>
      <div class="tabs rise" role="tablist" aria-label="Install method">
        <button type="button" class="tab" role="tab" aria-selected="true" data-cmd="Install halo in my site, then npx halo">Tokens</button>
        <span class="dot" aria-hidden="true">·</span>
        <button type="button" class="tab" role="tab" aria-selected="false" data-cmd='@import "halo/p3.css";'>CSS</button>
        <span class="dot" aria-hidden="true">·</span>
        <button type="button" class="tab" role="tab" aria-selected="false" data-cmd="Sync halo swatches into your Figma file">Figma</button>
        <span class="dot" aria-hidden="true">·</span>
        <button type="button" class="tab" role="tab" aria-selected="false" data-cmd="GET api.halo.dev/v1/palette?space=p3">API</button>
      </div>
      <div class="cmd rise">
        <span class="cmd-text" id="cmd">Install halo in my site, then npx halo</span>
        <button type="button" class="copy-btn" id="copy" aria-label="Copy command">
          <svg class="cp" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="12" height="12" rx="2.5" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
          <svg class="ok" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m5 12.5 4.5 4.5L19 7.5" />
          </svg>
        </button>
      </div>
    </div>
  </section>

  <script>
    (function () {
      var tabs = document.querySelectorAll('.tab[role="tab"]');
      var cmd = document.getElementById('cmd');
      var copyBtn = document.getElementById('copy');
      var swapTimer = 0;
      var doneTimer = 0;

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) {
            t.setAttribute('aria-selected', t === tab ? 'true' : 'false');
          });
          var nextText = tab.getAttribute('data-cmd') || '';
          if (cmd.textContent === nextText) return;
          clearTimeout(swapTimer);
          cmd.classList.add('swap');
          swapTimer = setTimeout(function () {
            cmd.textContent = nextText;
            cmd.classList.remove('swap');
          }, 160);
        });
      });

      copyBtn.addEventListener('click', function () {
        var text = cmd.textContent || '';
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).catch(function () {});
          }
        } catch (err) {}
        clearTimeout(doneTimer);
        copyBtn.classList.add('done');
        doneTimer = setTimeout(function () {
          copyBtn.classList.remove('done');
        }, 1400);
      });
    })();
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    /**
     * 3D glass prism, filleted mesh, and studio shaders ported from:
     * vercel-labs/vgpu (MIT License, Copyright (c) Vercel, Inc.)
     * apps/docs/app/[lang]/(home)/components/prism-background
     */
    import * as THREE from 'three';

    const stage = document.querySelector('.stage');
    const copyEl = document.querySelector('.copy');
    const glCanvas = document.getElementById('gl');
    const fxCanvas = document.getElementById('fx');
    const fxCtx = fxCanvas.getContext('2d', { alpha: true });

    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d', { alpha: true });

    const supportsCanvasFilter = typeof fxCtx.filter === 'string';
    const blurBufA = supportsCanvasFilter ? null : document.createElement('canvas');
    const blurBufB = supportsCanvasFilter ? null : document.createElement('canvas');
    const blurBufC = supportsCanvasFilter ? null : document.createElement('canvas');
    const blurCtxA = blurBufA ? blurBufA.getContext('2d', { alpha: true }) : null;
    const blurCtxB = blurBufB ? blurBufB.getContext('2d', { alpha: true }) : null;
    const blurCtxC = blurBufC ? blurBufC.getContext('2d', { alpha: true }) : null;

    // -----------------------------------------------------------------------
    // 5a. Layout state
    // -----------------------------------------------------------------------
    const layout = {
      W: 1,
      H: 1,
      dpr: 1,
      lightDpr: 1,
      mobile: false,
      S: 300,
      cx: 0,
      cy: 0,
      R: 0,
      far: 2000,
      verts: [
        [0, 0],
        [0, 0],
        [0, 0],
      ],
      edges: [
        [0, 1],
        [1, 2],
        [2, 0],
      ],
      normals: [
        [0, 0],
        [0, 0],
        [0, 0],
      ],
    };

    function computeLayout() {
      const rect = stage.getBoundingClientRect();
      const W = Math.max(1, Math.round(rect.width || window.innerWidth));
      const H = Math.max(1, Math.round(rect.height || window.innerHeight));
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const mobile = W < 820;
      const lightDpr = mobile ? Math.min(dpr, 1.5) : dpr;

      let S, cx, cy;
      if (mobile) {
        S = Math.min(W * 0.72, H * 0.40, 400);
        const copyRect = copyEl.getBoundingClientRect();
        const copyBottom = copyRect.bottom - rect.top;
        cx = W * 0.5;
        cy = Math.max(copyBottom + 30 + S * 0.62, (copyBottom + 30 + H) * 0.5);
      } else {
        S = Math.min(W * 0.36, H * 0.62);
        cx = 0.66 * W;
        cy = 0.53 * H;
      }

      const R = S / Math.sqrt(3);
      const top = [cx, cy - R];
      const right = [cx + S * 0.5, cy + R * 0.5];
      const left = [cx - S * 0.5, cy + R * 0.5];

      layout.W = W;
      layout.H = H;
      layout.dpr = dpr;
      layout.lightDpr = lightDpr;
      layout.mobile = mobile;
      layout.S = S;
      layout.cx = cx;
      layout.cy = cy;
      layout.R = R;
      layout.far = 1.5 * Math.hypot(W, H);
      layout.verts = [top, right, left];

      // Outward normals in 2D y-down space for edges 0 (top->right), 1 (right->left), 2 (left->top)
      for (let e = 0; e < 3; e++) {
        const a = layout.verts[layout.edges[e][0]];
        const b = layout.verts[layout.edges[e][1]];
        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const len = Math.hypot(dx, dy) || 1;
        layout.normals[e] = [dy / len, -dx / len];
      }

      const lw = Math.max(1, Math.round(W * lightDpr));
      const lh = Math.max(1, Math.round(H * lightDpr));
      offCanvas.width = lw;
      offCanvas.height = lh;
      fxCanvas.width = lw;
      fxCanvas.height = lh;

      if (!supportsCanvasFilter) {
        blurBufA.width = Math.max(1, Math.round(W / 16));
        blurBufA.height = Math.max(1, Math.round(H / 16));
        blurBufB.width = Math.max(1, Math.round(W / 6));
        blurBufB.height = Math.max(1, Math.round(H / 6));
        blurBufC.width = Math.max(1, Math.round(W / 2));
        blurBufC.height = Math.max(1, Math.round(H / 2));
      }
    }

    // -----------------------------------------------------------------------
    // 5b. Spectral Optics (72 wavelengths, Cauchy dispersion, Snell + Fresnel)
    // -----------------------------------------------------------------------
    const NUM_WL = 72;
    const WL_MIN = 410;
    const WL_MAX = 695;

    function rawSpectrumRGB(wl) {
      let r = 0, g = 0, b = 0;
      if (wl >= 380 && wl < 440) {
        r = -(wl - 440) / (440 - 380);
        g = 0;
        b = 1;
      } else if (wl >= 440 && wl < 490) {
        r = 0;
        g = (wl - 440) / (490 - 440);
        b = 1;
      } else if (wl >= 490 && wl < 510) {
        r = 0;
        g = 1;
        b = -(wl - 510) / (510 - 490);
      } else if (wl >= 510 && wl < 580) {
        r = (wl - 510) / (580 - 510);
        g = 1;
        b = 0;
      } else if (wl >= 580 && wl < 645) {
        r = 1;
        g = -(wl - 645) / (645 - 580);
        b = 0;
      } else if (wl >= 645 && wl <= 780) {
        r = 1;
        g = 0;
        b = 0;
      }

      let att = 1;
      if (wl < 420) att = 0.3 + 0.7 * (wl - 380) / (420 - 380);
      else if (wl > 700) att = 0.3 + 0.7 * (780 - wl) / (780 - 700);

      return [r * att, g * att, b * att];
    }

    const wavelengths = [];
    {
      let sumR = 0, sumG = 0, sumB = 0;
      const rawList = [];
      for (let i = 0; i < NUM_WL; i++) {
        const wl = WL_MIN + ((WL_MAX - WL_MIN) * i) / (NUM_WL - 1);
        const um = wl / 1000;
        const n = 1.2 + 0.1 / (um * um);
        const rgb = rawSpectrumRGB(wl);
        sumR += rgb[0];
        sumG += rgb[1];
        sumB += rgb[2];
        rawList.push({ wl, n, rgb });
      }
      for (let i = 0; i < NUM_WL; i++) {
        const { wl, n, rgb } = rawList[i];
        const vivid = [
          Math.round(Math.pow(rgb[0], 0.8) * 255),
          Math.round(Math.pow(rgb[1], 0.8) * 255),
          Math.round(Math.pow(rgb[2], 0.8) * 255),
        ];
        const br = sumR > 0 ? rgb[0] / sumR : 0;
        const bg = sumG > 0 ? rgb[1] / sumG : 0;
        const bb = sumB > 0 ? rgb[2] / sumB : 0;
        const weight = Math.max(br, bg, bb);
        const invW = weight > 0 ? 1 / weight : 0;
        const core = [
          Math.round(br * invW * 255),
          Math.round(bg * invW * 255),
          Math.round(bb * invW * 255),
        ];
        wavelengths.push({
          idx: i,
          wl,
          n,
          vividStr: `${vivid[0]},${vivid[1]},${vivid[2]}`,
          coreStr: `${core[0]},${core[1]},${core[2]}`,
          weight,
        });
      }
    }

    function lampForIncidence(aimInc, aimEntry) {
      const y = Math.max(0, Math.min(1, aimInc));
      const x = Math.max(0, Math.min(1, aimEntry));

      let incDeg;
      if (y <= 0.5) {
        incDeg = -35 + (60 - -35) * (y / 0.5);
      } else {
        incDeg = 60 + (75 - 60) * ((y - 0.5) / 0.5);
      }
      const incRad = (incDeg * Math.PI) / 180;

      // Right face inward normal = -normals[0], rotated by +incidence in y-down space
      const n0 = layout.normals[0];
      const ix = -n0[0];
      const iy = -n0[1];
      const c = Math.cos(incRad);
      const s = Math.sin(incRad);
      const dx = ix * c - iy * s;
      const dy = ix * s + iy * c;
      const dLen = Math.hypot(dx, dy) || 1;
      const dir = [dx / dLen, dy / dLen];

      const top = layout.verts[0];
      const right = layout.verts[1];
      const tEntry = 0.08 + (0.92 - 0.08) * x;
      const entry = [
        top[0] + (right[0] - top[0]) * tEntry,
        top[1] + (right[1] - top[1]) * tEntry,
      ];
      const source = [
        entry[0] - dir[0] * layout.far,
        entry[1] - dir[1] * layout.far,
      ];

      return { source, entry, dir };
    }

    function intersectEdge(ox, oy, dx, dy, ax, ay, bx, by) {
      const sx = bx - ax;
      const sy = by - ay;
      const denom = dx * sy - dy * sx;
      if (Math.abs(denom) < 1e-8) return null;
      const qx = ax - ox;
      const qy = ay - oy;
      const t = (qx * sy - qy * sx) / denom;
      const u = (qx * dy - qy * dx) / denom;
      if (t > 1e-3 && u >= -1e-4 && u <= 1 + 1e-4) {
        return { t, x: ox + dx * t, y: oy + dy * t };
      }
      return null;
    }

    function snellAndFresnel(ix, iy, nx, ny, n1, n2) {
      // nx, ny must oppose (ix, iy)
      let cosI = -(ix * nx + iy * ny);
      if (cosI < 0) {
        nx = -nx;
        ny = -ny;
        cosI = -cosI;
      }
      cosI = Math.min(1, cosI);
      const rx = ix + 2 * cosI * nx;
      const ry = iy + 2 * cosI * ny;
      const rLen = Math.hypot(rx, ry) || 1;
      const refl = [rx / rLen, ry / rLen];

      const eta = n1 / n2;
      const sin2T = eta * eta * (1 - cosI * cosI);
      if (sin2T >= 1) {
        return { tir: true, fresnel: 1, refl, trans: null };
      }
      const cosT = Math.sqrt(Math.max(0, 1 - sin2T));
      const tx = eta * ix + (eta * cosI - cosT) * nx;
      const ty = eta * iy + (eta * cosI - cosT) * ny;
      const tLen = Math.hypot(tx, ty) || 1;

      const rs = (n1 * cosI - n2 * cosT) / (n1 * cosI + n2 * cosT);
      const rp = (n1 * cosT - n2 * cosI) / (n1 * cosT + n2 * cosI);
      const fr = 0.5 * (rs * rs + rp * rp);

      return {
        tir: false,
        fresnel: fr,
        refl,
        trans: [tx / tLen, ty / tLen],
      };
    }

    function traceSpectrum(lamp) {
      const groups = new Map();
      const glints = [];

      function addSeg(key, inside, seg) {
        let g = groups.get(key);
        if (!g) {
          g = { key, inside, segs: [] };
          groups.set(key, g);
        }
        g.segs.push(seg);
      }

      // Entry face is always edge 0 (lamp aimed at right face)
      const entryFace = 0;
      const n0 = layout.normals[entryFace];
      glints.push({ face: entryFace, pt: lamp.entry, energy: 1.0 });

      function traceInside(ox, oy, dx, dy, lastFace, pathKey, energy, depth, wlObj) {
        if (depth > 7) return;

        // Find exit face inside prism
        let best = null;
        let hitFace = -1;
        for (let e = 0; e < 3; e++) {
          if (e === lastFace) continue;
          const n = layout.normals[e];
          if (dx * n[0] + dy * n[1] <= 1e-6) continue;
          const a = layout.verts[layout.edges[e][0]];
          const b = layout.verts[layout.edges[e][1]];
          const hit = intersectEdge(ox, oy, dx, dy, a[0], a[1], b[0], b[1]);
          if (hit && (!best || hit.t < best.t)) {
            best = hit;
            hitFace = e;
          }
        }
        if (!best) return;

        const pt = [best.x, best.y];
        addSeg(pathKey + '>' + hitFace, true, {
          wlIdx: wlObj.idx,
          wlObj,
          ax: ox,
          ay: oy,
          bx: pt[0],
          by: pt[1],
          energy,
        });

        // Inward normal at hitFace
        const nOut = layout.normals[hitFace];
        const opt = snellAndFresnel(dx, dy, -nOut[0], -nOut[1], wlObj.n, 1.0);

        if (!opt.tir) {
          const tEnergy = energy * (1 - opt.fresnel);
          if (tEnergy > 0.08) {
            const nextKey = pathKey + 'T' + hitFace;
            addSeg(nextKey, false, {
              wlIdx: wlObj.idx,
              wlObj,
              ax: pt[0],
              ay: pt[1],
              bx: pt[0] + opt.trans[0] * layout.far,
              by: pt[1] + opt.trans[1] * layout.far,
              energy: tEnergy,
            });
            if (wlObj.idx === Math.floor(NUM_WL / 2) || wlObj.idx === 0 || wlObj.idx === NUM_WL - 1) {
              glints.push({ face: hitFace, pt, energy: tEnergy });
            }
          }
        }

        const rEnergy = energy * opt.fresnel;
        if (rEnergy > 0.12) {
          traceInside(
            pt[0],
            pt[1],
            opt.refl[0],
            opt.refl[1],
            hitFace,
            pathKey + 'R' + hitFace,
            rEnergy,
            depth + 1,
            wlObj
          );
        }
      }

      for (let i = 0; i < NUM_WL; i++) {
        const wlObj = wavelengths[i];
        const opt = snellAndFresnel(lamp.dir[0], lamp.dir[1], n0[0], n0[1], 1.0, wlObj.n);

        const rEnergy = opt.fresnel;
        if (rEnergy > 0.12) {
          addSeg('R' + entryFace, false, {
            wlIdx: wlObj.idx,
            wlObj,
            ax: lamp.entry[0],
            ay: lamp.entry[1],
            bx: lamp.entry[0] + opt.refl[0] * layout.far,
            by: lamp.entry[1] + opt.refl[1] * layout.far,
            energy: rEnergy,
          });
        }

        const tEnergy = 1 - opt.fresnel;
        if (!opt.tir && tEnergy > 0.08) {
          traceInside(
            lamp.entry[0],
            lamp.entry[1],
            opt.trans[0],
            opt.trans[1],
            entryFace,
            'T' + entryFace,
            tEnergy,
            1,
            wlObj
          );
        }
      }

      return { groups, glints };
    }

    // -----------------------------------------------------------------------
    // 5c. Dust motes & 2D Light Rendering + Soft Bloom
    // -----------------------------------------------------------------------
    const DUST_COUNT = 70;
    const dustMotes = Array.from({ length: DUST_COUNT }, (_, i) => ({
      s: Math.random(),
      spread: (Math.random() - 0.5) * 2,
      speed: 0.015 + Math.random() * 0.025,
      radius: 0.5 + Math.random() * 1.1,
      twinkleSpeed: 1.1 + Math.random() * 2.2,
      phase: (i / DUST_COUNT) * Math.PI * 2 + Math.random() * 2.0,
    }));

    function drawLight(lamp, trace, elapsed, projectFn) {
      const { W, H, lightDpr, mobile, S } = layout;
      const scale = mobile ? 0.8 : 1;

      offCtx.setTransform(lightDpr, 0, 0, lightDpr, 0, 0);
      offCtx.clearRect(0, 0, W, H);
      offCtx.globalCompositeOperation = 'lighter';
      offCtx.lineCap = 'round';
      offCtx.lineJoin = 'round';

      const pSrc = projectFn(lamp.source[0], lamp.source[1]);
      const pEnt = projectFn(lamp.entry[0], lamp.entry[1]);

      // Incoming white beam
      offCtx.strokeStyle = 'rgba(255,255,255,0.3)';
      offCtx.lineWidth = 12 * scale;
      offCtx.beginPath();
      offCtx.moveTo(pSrc[0], pSrc[1]);
      offCtx.lineTo(pEnt[0], pEnt[1]);
      offCtx.stroke();

      offCtx.strokeStyle = 'rgba(255,255,255,1)';
      offCtx.lineWidth = 4.5 * scale;
      offCtx.beginPath();
      offCtx.moveTo(pSrc[0], pSrc[1]);
      offCtx.lineTo(pEnt[0], pEnt[1]);
      offCtx.stroke();

      // 70 dust motes drifting along incoming beam (wider away from prism)
      const perpX = -lamp.dir[1];
      const perpY = lamp.dir[0];
      const beamSpan = Math.max(W, H) * 0.72;
      for (let i = 0; i < DUST_COUNT; i++) {
        const m = dustMotes[i];
        const t = ((m.s + elapsed * m.speed) % 1 + 1) % 1; // 0 = near prism, 1 = far away
        const distAlong = 10 + t * beamSpan;
        const maxOffset = (4 + 34 * t) * scale;
        const wx = lamp.entry[0] - lamp.dir[0] * distAlong + perpX * m.spread * maxOffset;
        const wy = lamp.entry[1] - lamp.dir[1] * distAlong + perpY * m.spread * maxOffset;
        const p = projectFn(wx, wy);
        if (p[0] < -20 || p[0] > W + 20 || p[1] < -20 || p[1] > H + 20) continue;

        const tw = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(elapsed * m.twinkleSpeed + m.phase));
        const alpha = tw * 0.75 * (1 - t * 0.35);
        offCtx.fillStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
        offCtx.beginPath();
        offCtx.arc(p[0], p[1], m.radius * scale, 0, Math.PI * 2);
        offCtx.fill();
      }

      // Path groups: continuous spectral bands + white-balanced core lines
      for (const group of trace.groups.values()) {
        const segs = group.segs;
        if (!segs.length) continue;

        // Project all segment endpoints once per group
        const proj = segs.map((s) => ({
          s,
          a: projectFn(s.ax, s.ay),
          b: projectFn(s.bx, s.by),
        }));

        // Quad fills between neighbouring wavelengths
        for (let i = 0; i < proj.length - 1; i++) {
          const p0 = proj[i];
          const p1 = proj[i + 1];
          if (p1.s.wlIdx !== p0.s.wlIdx + 1) continue;

          const avgEnergy = 0.5 * (p0.s.energy + p1.s.energy);
          const rgbStr = p0.s.wlObj.vividStr;

          if (group.inside) {
            offCtx.fillStyle = `rgba(${rgbStr},${(avgEnergy * 0.5).toFixed(4)})`;
          } else {
            const mx0 = 0.5 * (p0.a[0] + p1.a[0]);
            const my0 = 0.5 * (p0.a[1] + p1.a[1]);
            const mx1 = 0.5 * (p0.b[0] + p1.b[0]);
            const my1 = 0.5 * (p0.b[1] + p1.b[1]);
            const a0 = avgEnergy * 0.78;
            const grad = offCtx.createLinearGradient(mx0, my0, mx1, my1);
            grad.addColorStop(0, `rgba(${rgbStr},${a0.toFixed(4)})`);
            grad.addColorStop(0.3, `rgba(${rgbStr},${(a0 * 0.75).toFixed(4)})`);
            grad.addColorStop(0.7, `rgba(${rgbStr},${(a0 * 0.25).toFixed(4)})`);
            grad.addColorStop(1, `rgba(${rgbStr},0)`);
            offCtx.fillStyle = grad;
          }

          offCtx.beginPath();
          offCtx.moveTo(p0.a[0], p0.a[1]);
          offCtx.lineTo(p0.b[0], p0.b[1]);
          offCtx.lineTo(p1.b[0], p1.b[1]);
          offCtx.lineTo(p1.a[0], p1.a[1]);
          offCtx.closePath();
          offCtx.fill();
        }

        // Core lines per wavelength
        offCtx.lineWidth = (group.inside ? 4 : 3.4) * scale;
        for (let i = 0; i < proj.length; i++) {
          const p = proj[i];
          const a = Math.min(1, p.s.wlObj.weight * p.s.energy * 2.2);
          if (a <= 0.002) continue;
          const coreStr = p.s.wlObj.coreStr;
          if (group.inside) {
            offCtx.strokeStyle = `rgba(${coreStr},${a.toFixed(4)})`;
          } else {
            const grad = offCtx.createLinearGradient(p.a[0], p.a[1], p.b[0], p.b[1]);
            grad.addColorStop(0, `rgba(${coreStr},${a.toFixed(4)})`);
            grad.addColorStop(0.3, `rgba(${coreStr},${(a * 0.75).toFixed(4)})`);
            grad.addColorStop(0.7, `rgba(${coreStr},${(a * 0.25).toFixed(4)})`);
            grad.addColorStop(1, `rgba(${coreStr},0)`);
            offCtx.strokeStyle = grad;
          }
          offCtx.beginPath();
          offCtx.moveTo(p.a[0], p.a[1]);
          offCtx.lineTo(p.b[0], p.b[1]);
          offCtx.stroke();
        }
      }

      // Edge glints where beam crosses a face
      for (let i = 0; i < trace.glints.length; i++) {
        const g = trace.glints[i];
        const edge = layout.edges[g.face];
        const va = layout.verts[edge[0]];
        const vb = layout.verts[edge[1]];
        const pa = projectFn(va[0], va[1]);
        const pb = projectFn(vb[0], vb[1]);
        const ph = projectFn(g.pt[0], g.pt[1]);
        const rad = Math.max(1, 0.2 * S);
        const strength = Math.min(1, g.energy);

        const rg = offCtx.createRadialGradient(ph[0], ph[1], 0, ph[0], ph[1], rad);
        rg.addColorStop(0, `rgba(255,255,255,${(0.9 * strength).toFixed(3)})`);
        rg.addColorStop(1, 'rgba(255,255,255,0)');
        offCtx.strokeStyle = rg;
        offCtx.lineWidth = 2;
        offCtx.beginPath();
        offCtx.moveTo(pa[0], pa[1]);
        offCtx.lineTo(pb[0], pb[1]);
        offCtx.stroke();

        offCtx.fillStyle = `rgba(255,255,255,${(0.95 * strength).toFixed(3)})`;
        offCtx.beginPath();
        offCtx.arc(ph[0], ph[1], 2.6, 0, Math.PI * 2);
        offCtx.fill();
      }

      // Soft bloom composite into #fx (no unblurred pass)
      fxCtx.setTransform(lightDpr, 0, 0, lightDpr, 0, 0);
      fxCtx.clearRect(0, 0, W, H);
      fxCtx.globalCompositeOperation = 'lighter';

      if (supportsCanvasFilter) {
        fxCtx.filter = 'blur(34px)';
        fxCtx.globalAlpha = 0.6;
        fxCtx.drawImage(offCanvas, 0, 0, W, H);

        fxCtx.filter = 'blur(12px)';
        fxCtx.globalAlpha = 0.9;
        fxCtx.drawImage(offCanvas, 0, 0, W, H);

        fxCtx.filter = 'blur(3.2px)';
        fxCtx.globalAlpha = 1.0;
        fxCtx.drawImage(offCanvas, 0, 0, W, H);

        fxCtx.filter = 'none';
        fxCtx.globalAlpha = 1.0;
      } else {
        blurCtxA.clearRect(0, 0, blurBufA.width, blurBufA.height);
        blurCtxA.imageSmoothingEnabled = true;
        blurCtxA.drawImage(offCanvas, 0, 0, blurBufA.width, blurBufA.height);

        blurCtxB.clearRect(0, 0, blurBufB.width, blurBufB.height);
        blurCtxB.imageSmoothingEnabled = true;
        blurCtxB.drawImage(offCanvas, 0, 0, blurBufB.width, blurBufB.height);

        blurCtxC.clearRect(0, 0, blurBufC.width, blurBufC.height);
        blurCtxC.imageSmoothingEnabled = true;
        blurCtxC.drawImage(offCanvas, 0, 0, blurBufC.width, blurBufC.height);

        fxCtx.imageSmoothingEnabled = true;
        fxCtx.globalAlpha = 0.6;
        fxCtx.drawImage(blurBufA, 0, 0, W, H);
        fxCtx.globalAlpha = 0.9;
        fxCtx.drawImage(blurBufB, 0, 0, W, H);
        fxCtx.globalAlpha = 1.0;
        fxCtx.drawImage(blurBufC, 0, 0, W, H);
      }
    }

    // -----------------------------------------------------------------------
    // 5d. Three.js 3D Glass Prism (WebGL2)
    // -----------------------------------------------------------------------
    function buildPrismGeometry(side, depth, fillet, cornerSegs, bevelSegs, edgeSegs) {
      const R = side / Math.sqrt(3);
      const rIn = side / (2 * Math.sqrt(3));
      const innerHalfZ = depth * 0.5 - fillet;

      // 2D rounded-triangle contour (CCW in XY, y-up, apex at top)
      // Corner centers inset by 2 * fillet along radial direction from origin
      const apexV = [0, R];
      const leftV = [-side * 0.5, -R * 0.5];
      const rightV = [side * 0.5, -R * 0.5];
      const scaleC = Math.max(0, 1 - (2 * fillet) / R);

      const corners = [
        { cx: apexV[0] * scaleC, cy: apexV[1] * scaleC, a0: Math.PI / 6, a1: (5 * Math.PI) / 6 },
        { cx: leftV[0] * scaleC, cy: leftV[1] * scaleC, a0: (5 * Math.PI) / 6, a1: (3 * Math.PI) / 2 },
        { cx: rightV[0] * scaleC, cy: rightV[1] * scaleC, a0: (3 * Math.PI) / 2, a1: (13 * Math.PI) / 6 },
      ];

      const contour = [];
      for (let c = 0; c < 3; c++) {
        const cur = corners[c];
        // Corner arc
        for (let i = 0; i <= cornerSegs; i++) {
          const t = i / cornerSegs;
          const ang = cur.a0 + (cur.a1 - cur.a0) * t;
          contour.push({
            bx: cur.cx,
            by: cur.cy,
            nx: Math.cos(ang),
            ny: Math.sin(ang),
          });
        }
        // Straight edge to next corner (using the constant face normal cur.a1)
        const nxt = corners[(c + 1) % 3];
        const fnx = Math.cos(cur.a1);
        const fny = Math.sin(cur.a1);
        for (let i = 1; i < edgeSegs; i++) {
          const t = i / edgeSegs;
          contour.push({
            bx: cur.cx + (nxt.cx - cur.cx) * t,
            by: cur.cy + (nxt.cy - cur.cy) * t,
            nx: fnx,
            ny: fny,
          });
        }
      }

      const ringCount = contour.length;
      const thetaMax = Math.PI * 0.5 - 0.06;

      // Rings from back cap (-z) to front cap (+z):
      // 0: back cap flat-normal rim
      // 1..bevelSegs+1: back bevel quarter-round (thetaMax -> 0)
      // bevelSegs+2..2*bevelSegs+2: front bevel quarter-round (0 -> thetaMax)
      // 2*bevelSegs+3: front cap flat-normal rim
      const rings = [];
      {
        const cosT = Math.cos(thetaMax);
        const sinT = Math.sin(thetaMax);
        rings.push({ rOff: fillet * cosT, z: -innerHalfZ - fillet * sinT, flatNz: -1 });
      }
      for (let b = bevelSegs; b >= 0; b--) {
        const theta = (b / bevelSegs) * thetaMax;
        rings.push({
          rOff: fillet * Math.cos(theta),
          z: -innerHalfZ - fillet * Math.sin(theta),
          cosT: Math.cos(theta),
          sinT: -Math.sin(theta),
        });
      }
      for (let b = 0; b <= bevelSegs; b++) {
        const theta = (b / bevelSegs) * thetaMax;
        rings.push({
          rOff: fillet * Math.cos(theta),
          z: innerHalfZ + fillet * Math.sin(theta),
          cosT: Math.cos(theta),
          sinT: Math.sin(theta),
        });
      }
      {
        const cosT = Math.cos(thetaMax);
        const sinT = Math.sin(thetaMax);
        rings.push({ rOff: fillet * cosT, z: innerHalfZ + fillet * sinT, flatNz: 1 });
      }

      const totalVerts = rings.length * ringCount + 2;
      const stride = 6; // px, py, pz, nx, ny, nz
      const data = new Float32Array(totalVerts * stride);

      let vOff = 0;
      for (let r = 0; r < rings.length; r++) {
        const ring = rings[r];
        for (let i = 0; i < ringCount; i++) {
          const p = contour[i];
          const px = p.bx + ring.rOff * p.nx;
          const py = p.by + ring.rOff * p.ny;
          const pz = ring.z;
          let nx, ny, nz;
          if (ring.flatNz !== undefined) {
            nx = 0;
            ny = 0;
            nz = ring.flatNz;
          } else {
            nx = p.nx * ring.cosT;
            ny = p.ny * ring.cosT;
            nz = ring.sinT;
          }
          data[vOff++] = px;
          data[vOff++] = py;
          data[vOff++] = pz;
          data[vOff++] = nx;
          data[vOff++] = ny;
          data[vOff++] = nz;
        }
      }

      // Back center and front center
      const backCenterIdx = rings.length * ringCount;
      const zCap = innerHalfZ + fillet * Math.sin(thetaMax);
      data[vOff++] = 0;
      data[vOff++] = 0;
      data[vOff++] = -zCap;
      data[vOff++] = 0;
      data[vOff++] = 0;
      data[vOff++] = -1;

      const frontCenterIdx = backCenterIdx + 1;
      data[vOff++] = 0;
      data[vOff++] = 0;
      data[vOff++] = zCap;
      data[vOff++] = 0;
      data[vOff++] = 0;
      data[vOff++] = 1;

      const indices = [];
      // Back cap fan (ring 0, CW when viewed from +Z so outward is -Z)
      for (let i = 0; i < ringCount; i++) {
        const next = (i + 1) % ringCount;
        indices.push(backCenterIdx, next, i);
      }
      // Side & bevel quads connecting ring 1 .. rings.length - 2
      for (let r = 1; r < rings.length - 2; r++) {
        const rowA = r * ringCount;
        const rowB = (r + 1) * ringCount;
        for (let i = 0; i < ringCount; i++) {
          const next = (i + 1) % ringCount;
          const a = rowA + i;
          const b = rowA + next;
          const c = rowB + next;
          const d = rowB + i;
          indices.push(a, b, c, a, c, d);
        }
      }
      // Front cap fan (last ring, CCW when viewed from +Z so outward is +Z)
      const lastRingStart = (rings.length - 1) * ringCount;
      for (let i = 0; i < ringCount; i++) {
        const next = (i + 1) % ringCount;
        indices.push(frontCenterIdx, lastRingStart + i, lastRingStart + next);
      }

      const geo = new THREE.BufferGeometry();
      const ib = new THREE.InterleavedBuffer(data, 6);
      geo.setAttribute('position', new THREE.InterleavedBufferAttribute(ib, 3, 0));
      geo.setAttribute('normal', new THREE.InterleavedBufferAttribute(ib, 3, 3));
      geo.setIndex(new THREE.BufferAttribute(new Uint16Array(indices), 1));
      geo.computeBoundingSphere();
      return { geo, rIn };
    }

    const GLSL_COMMON = /* glsl */ `
      vec3 srgbToLinear(vec3 c) {
        vec3 lo = c / 12.92;
        vec3 hi = pow(max((c + 0.055) / 1.055, vec3(1e-6)), vec3(2.4));
        return mix(lo, hi, step(vec3(0.04045), c));
      }

      vec3 linearToSrgb(vec3 c) {
        vec3 cl = max(c, vec3(0.0));
        vec3 lo = cl * 12.92;
        vec3 hi = 1.055 * pow(max(cl, vec3(1e-6)), vec3(1.0 / 2.4)) - 0.055;
        return mix(lo, hi, step(vec3(0.0031308), cl));
      }

      float softbox(vec3 dir, vec3 panelDir, vec2 size, float feather) {
        vec3 pDir = normalize(panelDir);
        float denom = dot(dir, pDir);
        if (denom <= 0.001) return 0.0;
        vec3 upRef = abs(pDir.y) > 0.99 ? vec3(0.0, 0.0, 1.0) : vec3(0.0, 1.0, 0.0);
        vec3 right = normalize(cross(upRef, pDir));
        vec3 up = cross(pDir, right);
        float u = dot(dir, right) / denom;
        float v = dot(dir, up) / denom;
        float sx = 1.0 - smoothstep(size.x - feather, size.x + feather, abs(u));
        float sy = 1.0 - smoothstep(size.y - feather, size.y + feather, abs(v));
        return sx * sy;
      }

      // Studio environment (vgpu environment.wgsl)
      vec3 sampleStudio(vec3 rawDir) {
        vec3 dir = normalize(rawDir);
        // Near-black room with darker back wall (-z) and slightly lighter floor
        float wallMix = smoothstep(-0.85, 0.75, dir.z);
        float floorLift = smoothstep(-0.05, -0.75, dir.y) * 0.012;
        vec3 c = vec3(0.005 + 0.008 * wallMix + floorLift);

        // Back-left wall panel
        c += vec3(0.82, 0.84, 0.88) * 0.011 *
             softbox(dir, vec3(-0.82, 0.08, 0.57), vec2(1.35, 1.1), 0.22);

        // Soft fill
        c += vec3(1.0, 0.97, 0.91) * 0.22 *
             softbox(dir, vec3(0.0, -0.707, 0.707), vec2(0.38, 0.62), 0.18);

        // Cool right key
        c += vec3(0.76, 0.88, 1.0) * 20.0 *
             softbox(dir, vec3(0.612, 0.354, 0.707), vec2(0.5, 0.16), 0.035);

        c = c / (1.0 + c);
        c = pow(max(c, vec3(1e-6)), vec3(1.0 / 2.2));
        c = srgbToLinear(c);
        return c * 2.3;
      }

      float fresnelSchlick(float cosTheta, float f0) {
        return f0 + (1.0 - f0) * pow(1.0 - clamp(cosTheta, 0.0, 1.0), 5.0);
      }

      int findClosestPlane(vec3 p, vec4 planes[5]) {
        int bestIdx = 0;
        float bestDist = 1e9;
        for (int i = 0; i < 5; i++) {
          float d = abs(planes[i].w - dot(p, planes[i].xyz));
          if (d < bestDist) {
            bestDist = d;
            bestIdx = i;
          }
        }
        return bestIdx;
      }

      void intersectIdealPlanes(vec3 p, vec3 d, int excludePlane, vec4 planes[5], out float outT, out int outPlane) {
        outT = 1e9;
        outPlane = -1;
        for (int i = 0; i < 5; i++) {
          if (i == excludePlane) continue;
          float denom = dot(d, planes[i].xyz);
          if (denom > 1e-5) {
            float t = (planes[i].w - dot(p, planes[i].xyz)) / denom;
            if (t >= 0.0 && t < outT) {
              outT = t;
              outPlane = i;
            }
          }
        }
      }
    `;

    function initWebGL2() {
      const testProbe = document.createElement('canvas');
      let probeGl = null;
      let isSoftwareGl = false;
      try {
        probeGl = testProbe.getContext('webgl2');
        if (!probeGl) return null;
        const dbg = probeGl.getExtension('WEBGL_debug_renderer_info');
        const param = dbg ? dbg.UNMASKED_RENDERER_WEBGL : probeGl.RENDERER;
        const gpuStr = String(probeGl.getParameter(param) || '');
        isSoftwareGl = /SwiftShader|llvmpipe|softpipe|Software|Basic Render/i.test(gpuStr);
        probeGl.getExtension('WEBGL_lose_context')?.loseContext();
      } catch (e) {
        return null;
      }

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({
          canvas: glCanvas,
          antialias: !isSoftwareGl,
          alpha: false,
          powerPreference: 'high-performance',
        });
      } catch (e) {
        return null;
      }

      if (!renderer.capabilities.isWebGL2) {
        renderer.dispose();
        return null;
      }

      renderer.autoClear = false;
      renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
      renderer.toneMapping = THREE.NoToneMapping;

      // Hide #fx and use it as CanvasTexture
      fxCanvas.style.display = 'none';
      const lightTex = new THREE.CanvasTexture(fxCanvas);
      lightTex.minFilter = THREE.LinearFilter;
      lightTex.magFilter = THREE.LinearFilter;
      lightTex.generateMipmaps = false;
      lightTex.colorSpace = THREE.NoColorSpace;

      const rt = new THREE.WebGLRenderTarget(1, 1, {
        type: THREE.HalfFloatType,
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter,
        depthBuffer: true,
        stencilBuffer: false,
      });

      const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const quadGeo = new THREE.PlaneGeometry(2, 2);

      const bgScene = new THREE.Scene();
      const bgMat = new THREE.ShaderMaterial({
        uniforms: {
          uLightTex: { value: lightTex },
          uBgSrgb: { value: new THREE.Vector3(0x15 / 255, 0x15 / 255, 0x17 / 255) },
        },
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position.xy, 0.0, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          uniform sampler2D uLightTex;
          uniform vec3 uBgSrgb;
          varying vec2 vUv;
          ${GLSL_COMMON}
          void main() {
            vec3 bg = srgbToLinear(uBgSrgb);
            vec4 light = texture2D(uLightTex, vUv);
            vec3 lightLin = srgbToLinear(light.rgb) * light.a;
            vec3 blended = 1.0 - (1.0 - bg) * (1.0 - lightLin);
            gl_FragColor = vec4(blended, 1.0);
          }
        `,
        depthTest: false,
        depthWrite: false,
      });
      bgScene.add(new THREE.Mesh(quadGeo, bgMat));

      const copyScene = new THREE.Scene();
      const copyMat = new THREE.ShaderMaterial({
        uniforms: {
          uTex: { value: rt.texture },
        },
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position.xy, 0.0, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          uniform sampler2D uTex;
          varying vec2 vUv;
          ${GLSL_COMMON}
          void main() {
            vec3 lin = texture2D(uTex, vUv).rgb;
            gl_FragColor = vec4(linearToSrgb(lin), 1.0);
          }
        `,
        depthTest: false,
        depthWrite: false,
      });
      copyScene.add(new THREE.Mesh(quadGeo, copyMat));

      const camera = new THREE.PerspectiveCamera(48, 1, 10, 10000);

      const IOR = 1.645;
      const F0 = Math.pow((IOR - 1) / (IOR + 1), 2);
      const REFL_STRENGTH = 2.14;
      const planesArr = [
        new THREE.Vector4(Math.sqrt(3) * 0.5, 0.5, 0, 1),
        new THREE.Vector4(0, -1, 0, 1),
        new THREE.Vector4(-Math.sqrt(3) * 0.5, 0.5, 0, 1),
        new THREE.Vector4(0, 0, 1, 1),
        new THREE.Vector4(0, 0, -1, 1),
      ];
      const viewProj = new THREE.Matrix4();
      const absorptionVec = new THREE.Vector3(1, 1, 0.54);

      const backMat = new THREE.ShaderMaterial({
        uniforms: {
          uIor: { value: IOR },
          uF0: { value: F0 },
          uReflStrength: { value: REFL_STRENGTH },
          uPlanes: { value: planesArr },
        },
        vertexShader: /* glsl */ `
          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            vWorldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uIor;
          uniform float uF0;
          uniform float uReflStrength;
          uniform vec4 uPlanes[5];
          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;
          ${GLSL_COMMON}

          vec3 traceInternalReflection(vec3 startP, vec3 startD, int excludeP) {
            vec3 p = startP;
            vec3 d = normalize(startD);
            int curExclude = excludeP;
            vec3 env = sampleStudio(d);

            for (int b = 0; b < 3; b++) {
              float tHit;
              int hitP;
              intersectIdealPlanes(p, d, curExclude, uPlanes, tHit, hitP);
              if (hitP < 0) break;

              p = p + d * tHit;
              vec3 nIn = -uPlanes[hitP].xyz;
              float cosI = clamp(-dot(d, nIn), 0.0, 1.0);
              float fExit = fresnelSchlick(cosI, uF0);
              vec3 exitDir = refract(d, nIn, uIor);
              if (dot(exitDir, exitDir) > 0.0001) {
                env = sampleStudio(exitDir) * (1.0 - fExit);
                break;
              }
              d = reflect(d, nIn);
              curExclude = hitP;
              env = sampleStudio(d);
            }
            return env;
          }

          void main() {
            vec3 viewDir = normalize(vWorldPos - cameraPosition);
            vec3 nIn = normalize(-vWorldNormal);
            if (dot(viewDir, nIn) > 0.0) nIn = -nIn;

            int hitPlane = findClosestPlane(vWorldPos, uPlanes);
            float cosI = clamp(-dot(viewDir, nIn), 0.0, 1.0);
            float fHit = fresnelSchlick(cosI, uF0);

            vec3 exitRay = refract(viewDir, nIn, uIor);
            bool escaped = dot(exitRay, exitRay) > 0.0001;

            vec3 reflDir = reflect(viewDir, nIn);
            vec3 env = traceInternalReflection(vWorldPos, reflDir, hitPlane);
            float weight = escaped ? fHit : 1.0;

            gl_FragColor = vec4(env * uReflStrength * weight, weight);
          }
        `,
        side: THREE.BackSide,
        transparent: true,
        blending: THREE.CustomBlending,
        blendSrc: THREE.OneFactor,
        blendDst: THREE.OneMinusSrcAlphaFactor,
        blendEquation: THREE.AddEquation,
        depthTest: false,
        depthWrite: false,
      });

      const frontMat = new THREE.ShaderMaterial({
        uniforms: {
          uIor: { value: IOR },
          uF0: { value: F0 },
          uReflStrength: { value: REFL_STRENGTH },
          uAbsorption: { value: absorptionVec },
          uPlanes: { value: planesArr },
          uViewProj: { value: viewProj },
          uBgTex: { value: rt.texture },
        },
        vertexShader: /* glsl */ `
          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            vWorldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uIor;
          uniform float uF0;
          uniform float uReflStrength;
          uniform vec3 uAbsorption;
          uniform vec4 uPlanes[5];
          uniform mat4 uViewProj;
          uniform sampler2D uBgTex;
          varying vec3 vWorldPos;
          varying vec3 vWorldNormal;
          ${GLSL_COMMON}

          void main() {
            vec3 viewDir = normalize(vWorldPos - cameraPosition);
            vec3 n = normalize(vWorldNormal);
            if (dot(viewDir, n) > 0.0) n = -n;

            float facing = clamp(-dot(viewDir, n), 0.0, 1.0);
            float F = fresnelSchlick(facing, uF0);

            vec3 reflDir = reflect(viewDir, n);
            vec3 env = sampleStudio(reflDir);
            vec3 reflected = env * uReflStrength;

            vec3 refrDir = refract(viewDir, n, 1.0 / uIor);
            if (dot(refrDir, refrDir) < 0.0001) {
              refrDir = viewDir;
            } else {
              refrDir = normalize(refrDir);
            }

            float dist;
            int exitPlane;
            intersectIdealPlanes(vWorldPos, refrDir, -1, uPlanes, dist, exitPlane);
            if (exitPlane < 0) dist = 0.0;

            vec3 exitPos = vWorldPos + refrDir * dist;
            vec4 clip = uViewProj * vec4(exitPos, 1.0);
            vec2 uv = (clip.xy / max(clip.w, 1e-5)) * 0.5 + 0.5;
            vec3 bgSample = texture2D(uBgTex, clamp(uv, 0.0, 1.0)).rgb;
            vec3 transmitted = bgSample * exp(-uAbsorption * dist);

            float envLum = dot(env, vec3(0.2126, 0.7152, 0.0722));
            float panelHighlight =
              smoothstep(0.5, 0.82, envLum) *
              clamp(uReflStrength * 0.4, 0.0, 0.7) *
              (0.65 + 0.35 * pow(max(1.0 - facing, 1e-6), 1.5));

            vec3 color = transmitted * (1.0 - F) + reflected * F + vec3(panelHighlight);

            // Soft shoulder above 0.8 instead of ACES
            vec3 over = max(color - vec3(0.8), vec3(0.0));
            color = min(color, vec3(0.8)) + (0.2 * over) / (over + vec3(0.2));

            gl_FragColor = vec4(linearToSrgb(color), 1.0);
          }
        `,
        side: THREE.FrontSide,
        transparent: false,
        depthTest: true,
        depthWrite: true,
      });

      const backScene = new THREE.Scene();
      const frontScene = new THREE.Scene();
      let prismGeo = null;
      const backMesh = new THREE.Mesh(new THREE.BufferGeometry(), backMat);
      const frontMesh = new THREE.Mesh(new THREE.BufferGeometry(), frontMat);
      backScene.add(backMesh);
      frontScene.add(frontMesh);

      function syncSize() {
        const { W, H, dpr, S } = layout;
        renderer.setPixelRatio(isSoftwareGl ? 1 : dpr);
        renderer.setSize(W, H, false);
        const rtDpr = isSoftwareGl ? 1 : dpr;
        rt.setSize(Math.max(1, Math.round(W * rtDpr)), Math.max(1, Math.round(H * rtDpr)));

        const depth = (S * 0.3) / 0.57;
        const fillet = (S * 0.008) / 0.57;
        const { geo, rIn } = buildPrismGeometry(S, depth, fillet, 4, 4, 16);
        if (prismGeo) prismGeo.dispose();
        prismGeo = geo;
        backMesh.geometry = geo;
        frontMesh.geometry = geo;

        planesArr[0].w = rIn;
        planesArr[1].w = rIn;
        planesArr[2].w = rIn;
        planesArr[3].w = depth * 0.5;
        planesArr[4].w = depth * 0.5;

        const absScale = 0.57 / Math.max(S, 1);
        absorptionVec.set(1.0 * absScale, 1.0 * absScale, 0.54 * absScale);
      }

      const projVec = new THREE.Vector3();
      function updateCamera(orbitX, orbitY) {
        const { W, H, cx, cy } = layout;
        const fovRad = (48 * Math.PI) / 180;
        const D = (H * 0.5) / Math.tan(fovRad * 0.5);
        camera.aspect = W / H;
        camera.near = Math.max(1, D * 0.05);
        camera.far = D * 10;
        camera.setViewOffset(W, H, W * 0.5 - cx, H * 0.5 - cy, W, H);
        camera.updateProjectionMatrix();

        const maxAngle = (3.5 * Math.PI) / 180;
        const yaw = orbitX * maxAngle;
        const pitch = -orbitY * maxAngle;
        const cosP = Math.cos(pitch);
        camera.position.set(
          D * Math.sin(yaw) * cosP,
          D * Math.sin(pitch),
          D * Math.cos(yaw) * cosP
        );
        camera.lookAt(0, 0, 0);
        camera.updateMatrixWorld();
        viewProj.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
      }

      function projectPlane(px, py) {
        projVec.set(px - layout.cx, -(py - layout.cy), 0).project(camera);
        return [
          (projVec.x * 0.5 + 0.5) * layout.W,
          (-projVec.y * 0.5 + 0.5) * layout.H,
        ];
      }

      function renderFrame() {
        lightTex.needsUpdate = true;

        // 1. Bg + screen-blended light into HalfFloat RT
        renderer.setRenderTarget(rt);
        renderer.clear(true, true, false);
        renderer.render(bgScene, orthoCam);

        // 2. Back faces into RT (premultiplied ONE / ONE_MINUS_SRC_ALPHA)
        renderer.render(backScene, camera);

        // 3. Copy RT to screen (linear -> sRGB)
        renderer.setRenderTarget(null);
        renderer.clear(true, true, false);
        renderer.render(copyScene, orthoCam);

        // 4. Front faces to screen
        renderer.render(frontScene, camera);
      }

      glCanvas.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();
      });

      return {
        isSoftwareGl,
        renderer,
        syncSize,
        updateCamera,
        projectPlane,
        renderFrame,
      };
    }

    // -----------------------------------------------------------------------
    // 5e. Interaction & Animation Loop
    // -----------------------------------------------------------------------
    computeLayout();
    const glCtx = initWebGL2();
    if (glCtx) {
      glCtx.syncSize();
    } else {
      glCanvas.style.display = 'none';
      fxCanvas.style.display = '';
    }

    const reducedMotionMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
    let reducedMotion = reducedMotionMQ.matches;
    reducedMotionMQ.addEventListener?.('change', (e) => {
      reducedMotion = e.matches;
    });

    const aim = [0.46, 0.42];
    const aimTarget = [0.46, 0.42];
    const orbit = [0, 0];
    const orbitTarget = [0, 0];
    let lastPointerTime = -Infinity;
    let hasPointerInteracted = false;

    function updateFromClient(clientX, clientY) {
      const rect = stage.getBoundingClientRect();
      const nx = Math.max(0, Math.min(1, (clientX - rect.left) / Math.max(1, rect.width)));
      const ny = Math.max(0, Math.min(1, (clientY - rect.top) / Math.max(1, rect.height)));
      aimTarget[0] = ny;
      aimTarget[1] = nx;
      if (!layout.mobile) {
        orbitTarget[0] = nx * 2 - 1;
        orbitTarget[1] = ny * 2 - 1;
      } else {
        orbitTarget[0] = 0;
        orbitTarget[1] = 0;
      }
      lastPointerTime = performance.now();
      hasPointerInteracted = true;
    }

    window.addEventListener('pointermove', (e) => {
      if (!e.isPrimary) return;
      updateFromClient(e.clientX, e.clientY);
    });

    window.addEventListener('pointerdown', (e) => {
      if (!e.isPrimary) return;
      updateFromClient(e.clientX, e.clientY);
    });

    window.addEventListener(
      'touchmove',
      (e) => {
        if (e.touches && e.touches.length > 0) {
          updateFromClient(e.touches[0].clientX, e.touches[0].clientY);
        }
      },
      { passive: true }
    );

    document.addEventListener('mouseleave', () => {
      orbitTarget[0] = 0;
      orbitTarget[1] = 0;
    });

    let resizeTimer = 0;
    function handleResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        computeLayout();
        if (glCtx) glCtx.syncSize();
      }, 60);
    }

    window.addEventListener('resize', handleResize);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        computeLayout();
        if (glCtx) glCtx.syncSize();
      });
    }

    let lastNow = performance.now();
    const startTime = lastNow;
    let frameId = 0;

    function afterDraw(cb) {
      const gl = glCtx.renderer.getContext();
      const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
      gl.flush();
      const poll = () => {
        const state = sync && gl.getSyncParameter(sync, gl.SYNC_STATUS);
        if (state === gl.UNSIGNALED) {
          frameId = window.setTimeout(poll, 5);
        } else {
          if (sync) gl.deleteSync(sync);
          frameId = window.setTimeout(cb, 80);
        }
      };
      frameId = window.setTimeout(poll, 5);
    }

    function drawFallbackOutline() {
      const [v0, v1, v2] = layout.verts;
      fxCtx.save();
      fxCtx.setTransform(layout.lightDpr, 0, 0, layout.lightDpr, 0, 0);
      fxCtx.globalCompositeOperation = 'source-over';
      fxCtx.strokeStyle = 'rgba(255,255,255,0.22)';
      fxCtx.lineWidth = 1.25;
      fxCtx.beginPath();
      fxCtx.moveTo(v0[0], v0[1]);
      fxCtx.lineTo(v1[0], v1[1]);
      fxCtx.lineTo(v2[0], v2[1]);
      fxCtx.closePath();
      fxCtx.stroke();
      fxCtx.restore();
    }

    function tick() {
      const now = performance.now();
      const dt = Math.min(0.1, Math.max(0.001, (now - lastNow) / 1000));
      lastNow = now;
      const elapsed = (now - startTime) / 1000;

      const isIdleDesktop = !layout.mobile && (!hasPointerInteracted || now - lastPointerTime > 6000);
      if (!reducedMotion && (layout.mobile || isIdleDesktop)) {
        const angle = (elapsed / 18) * Math.PI * 2;
        const vx = 0.5 + 0.34 * Math.cos(angle);
        const vy = 0.5 + 0.34 * Math.sin(angle);
        aimTarget[0] = vy;
        aimTarget[1] = vx;
        if (!layout.mobile) {
          orbitTarget[0] = vx * 2 - 1;
          orbitTarget[1] = vy * 2 - 1;
        } else {
          orbitTarget[0] = 0;
          orbitTarget[1] = 0;
        }
      } else if (layout.mobile) {
        orbitTarget[0] = 0;
        orbitTarget[1] = 0;
      }

      const frames = dt * 60;
      const lampEase = 1 - Math.pow(1 - 0.12, frames);
      const camEase = 1 - Math.pow(1 - 0.08, frames);

      aim[0] += (aimTarget[0] - aim[0]) * lampEase;
      aim[1] += (aimTarget[1] - aim[1]) * lampEase;
      orbit[0] += (orbitTarget[0] - orbit[0]) * camEase;
      orbit[1] += (orbitTarget[1] - orbit[1]) * camEase;

      if (glCtx) {
        glCtx.updateCamera(orbit[0], orbit[1]);
      }

      const lamp = lampForIncidence(aim[0], aim[1]);
      const trace = traceSpectrum(lamp);
      const projectFn = glCtx ? glCtx.projectPlane : (x, y) => [x, y];
      drawLight(lamp, trace, reducedMotion ? 0 : elapsed, projectFn);

      if (glCtx) {
        glCtx.renderFrame();
        if (glCtx.isSoftwareGl) {
          afterDraw(tick);
        } else {
          frameId = requestAnimationFrame(tick);
        }
      } else {
        drawFallbackOutline();
        frameId = requestAnimationFrame(tick);
      }
    }

    frameId = requestAnimationFrame(tick);
  </script>
</body>
</html>
